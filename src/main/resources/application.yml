spring:
  application:
    name: drama-studio
  profiles:
    default: demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
drama:
  provider:
    mode: ${DRAMA_PROVIDER_MODE:mock}
    volcengine:
      api-key: ${ARK_API_KEY:}
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      text-model: ${ARK_TEXT_MODEL:}
      director-model: ${ARK_DIRECTOR_MODEL:${ARK_TEXT_MODEL:}}
      image-model: ${ARK_IMAGE_MODEL:}
      video-model: ${ARK_VIDEO_MODEL:}
      vlm-model: ${ARK_VLM_MODEL:}
      text-api-style: ${ARK_TEXT_API_STYLE:responses}
      director-api-style: ${ARK_DIRECTOR_API_STYLE:${ARK_TEXT_API_STYLE:responses}}
      request-timeout: ${ARK_REQUEST_TIMEOUT:10m}
      max-output-tokens: ${ARK_MAX_OUTPUT_TOKENS:16384}
      video-supported-durations: ${ARK_VIDEO_SUPPORTED_DURATIONS:4,8,12}
    seed-audio:
      endpoint: ${SEED_AUDIO_URL:https://openspeech.bytedance.com/api/v3/tts/create}
      api-key: ${SEED_AUDIO_API_KEY:}
      model: ${SEED_AUDIO_MODEL:seed-audio-1.0}
      request-timeout: 5m
  storage:
    mode: ${STORAGE_MODE:local}
    root: ${STORAGE_ROOT:./data/media}
    s3:
      endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
      region: ${STORAGE_REGION:us-east-1}
      bucket: ${STORAGE_BUCKET:drama}
      access-key: ${STORAGE_ACCESS_KEY:}
      secret-key: ${STORAGE_SECRET_KEY:}
  jobs:
    enabled: true
    poll-delay-ms: 1500
    max-attempts: 3
  quality:
    visual-reviewer: ${VISUAL_REVIEWER:fake}
    high-risk-confidence: ${VLM_HIGH_RISK_CONFIDENCE:0.90}
    standard-confidence: ${VLM_STANDARD_CONFIDENCE:0.80}
    regenerate-confidence: ${VLM_REGENERATE_CONFIDENCE:0.85}
  redis:
    enabled: false
  render:
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    ffprobe: ${FFPROBE_PATH:ffprobe}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/drama}
    username: ${DATABASE_USER:drama}
    password: ${DATABASE_PASSWORD}
  flyway:
    locations: classpath:db/migration/common
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
drama:
  provider:
    mode: ${DRAMA_PROVIDER_MODE:volcengine}
  redis:
    enabled: true
management:
  health:
    redis:
      enabled: true
